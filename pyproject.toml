[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "altirs-sdk"
version = "0.1.0"
description = "Python SDK for the Altirs (Guardrails-as-a-Service) API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["httpx>=0.27"]

[project.urls]
Homepage = "https://altirs.ai"
Documentation = "https://altirs.ai/docs"
Repository = "https://github.com/altirs/sdk-python"

[tool.hatch.build.targets.wheel]
packages = ["altirs"]

[tool.hatch.build.targets.sdist]
include = ["altirs", "README.md", "LICENSE"]
